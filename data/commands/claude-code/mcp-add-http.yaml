id: claude-code-mcp-add-http
name: Add a remote MCP server
agent: claude-code
type: mcp-install
command: claude mcp add --transport http <name> <url>
description: Adds a remote MCP server over HTTP. Replace <name> and <url> with your own. HTTP is the recommended way to connect remote servers.
tags:
  - mcp
  - setup
  - http
source_url: https://docs.claude.com/en/docs/claude-code/mcp
last_verified: 2026-10-07
risk:
  - uses-network
author: Tobi-toons
