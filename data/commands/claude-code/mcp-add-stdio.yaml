id: claude-code-mcp-add-stdio
name: Add a local MCP server
agent: claude-code
type: mcp-install
command: claude mcp add --transport stdio <name> -- <command> [args...]
description: Adds an MCP server that runs on your computer. Everything after the -- is the command that starts the server.
tags:
  - mcp
  - setup
  - stdio
source_url: https://docs.claude.com/en/docs/claude-code/mcp
last_verified: 2026-10-07
risk:
  - runs-shell
author: Tobi-toons
