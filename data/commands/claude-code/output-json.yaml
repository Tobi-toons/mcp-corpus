id: claude-code-output-json
name: Get the answer as JSON
agent: claude-code
type: flag
command: claude -p "query" --output-format json
description: Prints the answer as JSON instead of plain text, so another program can read it. You can also use stream-json.
tags:
  - non-interactive
  - scripts
  - json
source_url: https://docs.claude.com/en/docs/claude-code/cli-reference
