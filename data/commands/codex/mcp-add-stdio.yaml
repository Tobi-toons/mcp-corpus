id: codex-mcp-add-stdio
name: Add a local MCP server
agent: codex
type: mcp-install
command: codex mcp add <name> -- <command...>
description: Saves an MCP server that Codex starts on your computer. Everything after the -- is the start command. Add --env KEY=VALUE to pass settings.
