id: cursor-print-mode
name: Ask once and print the answer
agent: cursor
type: flag
command: agent -p "List all TODO comments in this repo"
description: Runs one task, prints the answer, and exits. In this mode the agent can use all its tools, including writing files and running shell commands.
tags:
