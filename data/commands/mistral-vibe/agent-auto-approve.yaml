id: vibe-agent-auto-approve
name: Approve everything automatically
agent: mistral-vibe
type: flag
command: vibe --agent auto-approve
description: Starts Vibe with the auto-approve agent. It will not stop to ask before it edits files or runs commands. Only use it in a project you trust.
